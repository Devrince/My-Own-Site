<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
        <meta name="theme-color" content="#080b18">
        <title>New post | devrince.org</title>
        <link rel="icon" href="logo.png" type="image/png+xml">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
         
        <header class="site-header">
            <a class="brand" href="index.html">
                <img src="logo.png" alt="devrince logo" class="logo-img">
                <span>devrince.org</span>
            </a>
        </header>

        <main>
            <div class="page-heading">
                <p class="eyebrow">Keep the journey going</p>
                <h1 class="page-title">New post<span class="brand-dot">.</span></h1>
            </div>
            <p class="note">
                Draft a post entry, then add it to <code>posts.js</code> and publish your updated site.
                This static-site helper does not publish posts or provide sign-in protection.
            </p>

            <form id="post-form" class="admin-form">
                <label for="title">Title
                    <input id="title" name="title" required>
                </label>
                <label for="date">Date
                    <input type="date" id="date" name="date" required>
                </label>
                <label for="body">Post text (leave a blank line between paragraphs)
                    <textarea id="body" name="body" rows="10" required></textarea>
                </label>
                <button class="button button-primary" type="submit">Make post</button>
            </form>

            <div class="admin-output">
                <label for="output">Code to paste into posts.js
                    <textarea id="output" rows="12" readonly></textarea>
                </label>
                <button class="button button-primary" id="copy" type="button">Copy code</button>
                <p class="form-status" id="form-status" aria-live="polite"></p>
            </div>
        </main>

        <footer class="site-footer">
            <a class="footer-brand" href="index.html">devrince.org <span class="brand-dot">✦</span></a>
            <p>Made with curiosity by Prince Joshi · © 2026</p>
            <a class="back-to-top" href="index.html">Back to site ↑</a>
        </footer>
        
        <script src="script.js"></script>

    </body>
</html>
